  <!-- ═══════════════════════════════════════════════════════════
       Google Analytics · G-F75FRV6MMR

       ★ `async` ו-`preconnect` — הסקריפט לא חוסם את הרינדור.
         בלי ה-preconnect, הבקשה הראשונה ל-googletagmanager משלמת
         DNS + TLS מלאים בדיוק בשנייה שבה המסך הראשון נטען.

       ⚠ אין כאן מסך הסכמה (consent). לתעבורה ישראלית זה מקובל;
         אם תגיע תעבורה מהאיחוד האירופי, GA4 דורש Consent Mode —
         זו הוספה נפרדת ולא שורה בקובץ הזה.
       ═══════════════════════════════════════════════════════════ -->
  <link rel="preconnect" href="https://www.googletagmanager.com" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F75FRV6MMR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-F75FRV6MMR');
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    ★ Frank Ruhl Libre נוסף בסבב "עיתון של פעם".
      זה גופן העיתונות העברית הקלאסי, והוא לבד עושה חצי מהעבודה:
      אותו מסך ב-Heebo נקרא כמו אפליקציה, ובו הוא נקרא כמו עמוד
      ספורט. הוא נטען עם `display=swap` ועם fallback סריפי, ולכן
      מסך שלא הספיק לטעון אותו עדיין נראה נכון.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <noscript>האפליקציה דורשת JavaScript.</noscript>
  <script type="module" src="/src/main.tsx"></script>

  <!-- ═══════════════════════════════════════════════════════════════
       ★★ שומר הסגנונות ★★

       האתר עלה פעם אחת **בלי גיליון סגנונות בכלל**: כותרות בגודל
       ברירת מחדל, כפתורים אפורים, ורקע כהה שמגיע מ-`color-scheme`
       ולא מהמוצר. הסיבה הייתה Service Worker עם גרסת מטמון קבועה,
       שהגיש HTML חדש עם נכסים ישנים.

       ★ מה שהפך את זה לגרוע פי כמה: **שום דבר לא צעק.**
         הדף "עבד" — הוא פשוט נראה כמו טיוטה. אין שגיאה בקונסול,
         אין 404, ו-Ctrl+Shift+R לא עוזר כי ה-SW חוטף את הבקשה.

       הבלוק הזה בודק תוצאה במקום להניח אותה: הוא יוצר אלמנט עם
       מחלקה שאמורה להיות מעוצבת, ומודד. אם הכלל לא חל — ה-CSS
       לא נטען, נקודה.

       ואז הוא **מרפא את עצמו**: מוחק את ה-SW ואת המטמונים,
       ומרענן. פעם אחת בלבד — אם גם אחריה אין CSS, הבעיה במקום
       אחר, ואז הוא אומר את זה בעברית במקום להיכנס ללולאה.

       ⚠ המחלקה `.tap` מוגדרת ב-tailwind.config.ts כ-`min-height: 44px`.
         אם היא תשונה שם — לעדכן גם כאן.
       ═══════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      var KEY = 'dubid.css.recover.v1';

      function stylesLoaded() {
        var probe = document.createElement('div');
        probe.className = 'tap';
        probe.style.position = 'absolute';
        probe.style.visibility = 'hidden';
        probe.style.pointerEvents = 'none';
        document.body.appendChild(probe);
        var h = window.getComputedStyle(probe).minHeight;
        probe.parentNode.removeChild(probe);
        return h === '44px';
      }

      function tellUser() {
        var bar = document.createElement('div');
        bar.setAttribute('dir', 'rtl');
        bar.style.cssText =
          'position:fixed;inset-inline:0;top:0;z-index:2147483647;' +
          'background:#7a1f1a;color:#fff;padding:10px 14px;' +
          'font:600 13px/1.5 Assistant,Arial,sans-serif;text-align:center';
        bar.innerHTML =
          'העיצוב לא נטען. נסו לרענן, ואם זה חוזר — ' +
          '<a href="/reset.html" style="color:#ffd98a">לחצו כאן לאיפוס</a>.';
        document.body.appendChild(bar);
      }

      function heal() {
        var done = function () {
          try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
          location.reload();
        };
        var jobs = [];
        if (window.caches && caches.keys) {
          jobs.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
          }));
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
            return Promise.all(rs.map(function (r) { return r.unregister(); }));
          }));
        }
        // גם אם אחד מהם נכשל — מרעננים בכל מקרה.
        Promise.all(jobs).then(done, done);
      }

      window.addEventListener('load', function () {
        // רגע אחד אחרי load: גיליונות סגנונות עשויים עוד להיקלט.
        setTimeout(function () {
          try {
            if (stylesLoaded()) return;
            var tried = false;
            try { tried = sessionStorage.getItem(KEY) === '1'; } catch (e) {}
            // ★ ריפוי אחד בלבד. שני ריענונים אוטומטיים ברצף הם לולאה.
            if (tried) { tellUser(); return; }
            heal();
          } catch (e) {
            /* בדיקה שנכשלת לא תפיל את האפליקציה. */
          }
        }, 400);
      });
    })();
  </script>
</body>
</html>
