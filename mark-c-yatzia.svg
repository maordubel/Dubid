<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="דוביד — סימן ג׳: היציע">
  <defs>
    <linearGradient id="flood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D6247"/>
      <stop offset="100%" stop-color="#0A2A1E"/>
    </linearGradient>
    <radialGradient id="smoke" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#F6F3EB" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F6F3EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5B14" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF5B14" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="96"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#flood)"/>
    <!-- אלומת זרקור -->
    <path d="M256 -60 L486 512 L26 512 Z" fill="#F6F3EB" opacity="0.07"/>
    <!-- אובך זרקורים -->
    <ellipse cx="256" cy="210" rx="220" ry="160" fill="url(#smoke)"/>
    <!-- זוהר הנפץ סביב המושב שלך בלבד -->
    <circle cx="257" cy="212" r="110" fill="url(#flare)"/>

    <!-- יציע: חמש שורות כיסאות בפרספקטיבה.
         הצבעים מעורבים בתוך השורה — יציע אמיתי אף פעם לא אחיד. -->
    <!-- שורה 1 (הרחוקה) -->
    <g>
      <rect x="152" y="118" width="26" height="19" rx="6" fill="#1F7FD1"/>
      <rect x="186" y="118" width="26" height="19" rx="6" fill="#1F7FD1"/>
      <rect x="220" y="118" width="26" height="19" rx="6" fill="#F6F3EB" opacity=".85"/>
      <rect x="254" y="118" width="26" height="19" rx="6" fill="#1F7FD1"/>
      <rect x="288" y="118" width="26" height="19" rx="6" fill="#1F7FD1"/>
      <rect x="322" y="118" width="26" height="19" rx="6" fill="#F6F3EB" opacity=".85"/>
    </g>
    <!-- שורה 2 -->
    <g>
      <rect x="126" y="160" width="32" height="23" rx="7" fill="#F6F3EB" opacity=".9"/>
      <rect x="166" y="160" width="32" height="23" rx="7" fill="#1F7FD1"/>
      <rect x="206" y="160" width="32" height="23" rx="7" fill="#F6F3EB" opacity=".9"/>
      <rect x="246" y="160" width="32" height="23" rx="7" fill="#F6F3EB" opacity=".9"/>
      <!-- מושב ריק: החור ביציע -->
      <rect x="286" y="160" width="32" height="23" rx="7" fill="#0A2A1E" opacity=".55"/>
      <rect x="326" y="160" width="32" height="23" rx="7" fill="#1F7FD1"/>
      <rect x="366" y="160" width="32" height="23" rx="7" fill="#F6F3EB" opacity=".9"/>
    </g>
    <!-- שורה 3 — כאן יושב המשתמש -->
    <g>
      <rect x="100" y="210" width="38" height="28" rx="8" fill="#1F7FD1"/>
      <rect x="146" y="210" width="38" height="28" rx="8" fill="#F6F3EB" opacity=".9"/>
      <rect x="192" y="210" width="38" height="28" rx="8" fill="#1F7FD1"/>
      <rect x="284" y="210" width="38" height="28" rx="8" fill="#1F7FD1"/>
      <rect x="330" y="210" width="38" height="28" rx="8" fill="#F6F3EB" opacity=".9"/>
      <rect x="376" y="210" width="38" height="28" rx="8" fill="#1F7FD1"/>
    </g>
    <!-- ★ אתה -->
    <rect x="238" y="210" width="38" height="28" rx="8" fill="#FF5B14"/>
    <circle cx="257" cy="186" r="15" fill="#FF5B14"/>
    <path d="M234 212 C234 197 280 197 280 212 Z" fill="#FF5B14"/>

    <!-- שורה 4 -->
    <g>
      <rect x="68"  y="272" width="46" height="34" rx="10" fill="#F6F3EB" opacity=".92"/>
      <rect x="122" y="272" width="46" height="34" rx="10" fill="#1F7FD1"/>
      <rect x="176" y="272" width="46" height="34" rx="10" fill="#F6F3EB" opacity=".92"/>
      <rect x="230" y="272" width="46" height="34" rx="10" fill="#1F7FD1"/>
      <rect x="284" y="272" width="46" height="34" rx="10" fill="#F6F3EB" opacity=".92"/>
      <rect x="338" y="272" width="46" height="34" rx="10" fill="#1F7FD1"/>
      <rect x="392" y="272" width="46" height="34" rx="10" fill="#F6F3EB" opacity=".92"/>
    </g>
    <!-- שורה 5 (הקרובה) -->
    <g>
      <rect x="30"  y="346" width="58" height="44" rx="13" fill="#1F7FD1"/>
      <rect x="98"  y="346" width="58" height="44" rx="13" fill="#F6F3EB" opacity=".95"/>
      <rect x="166" y="346" width="58" height="44" rx="13" fill="#1F7FD1"/>
      <rect x="234" y="346" width="58" height="44" rx="13" fill="#1F7FD1"/>
      <rect x="302" y="346" width="58" height="44" rx="13" fill="#F6F3EB" opacity=".95"/>
      <rect x="370" y="346" width="58" height="44" rx="13" fill="#1F7FD1"/>
    </g>

    <!-- קווי הגיר של המגרש -->
    <rect x="0" y="430" width="512" height="11" fill="#F6F3EB" opacity=".92"/>
    <path d="M170 441 a86 86 0 0 0 172 0" fill="none" stroke="#F6F3EB"
          stroke-width="11" opacity=".92"/>
  </g>
</svg>
