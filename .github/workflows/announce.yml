name: Round announcements
# Every 15 minutes: scan the lifecycle for events worth telling the owner (round opened, reminder, locked, results + tables,
# ingest alerts), render the card and send it to Telegram. Needs secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN.
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
concurrency: {group: dubid-announce, cancel-in-progress: false}
permissions: {contents: read}
jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/announce/run.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
