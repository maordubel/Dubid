name: Probe sources
on:
  workflow_dispatch:
  push:
    branches: [work/data-sources]
    paths: ['scripts/probe/**']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/probe/sources.mjs > probe-result.txt 2>&1 || true
      - name: Commit result
        run: |
          git config user.name probe-bot
          git config user.email probe@users.noreply.github.com
          git add -f probe-result.txt probe-games.json probe-espn.json
          git commit -m "probe result" || true
          git push || true
